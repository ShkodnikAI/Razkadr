name: orchestrate

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request_target:
    types: [unlabeled, ready_for_review]
  issues:
    types: [closed, unlabeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: orchestrate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Код берётся из default-ветки, код из PR здесь не выполняется.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Автомёрж и раздача нарядов
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/automerge.py
