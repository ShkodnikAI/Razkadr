name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg, LibreOffice, fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libreoffice-impress fonts-liberation fonts-dejavu-core poppler-utils
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
