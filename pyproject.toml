[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "razkadr"
version = "0.0.1"
description = "Video in, deck out: video -> storyboard -> presentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
razkadr = "razkadr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts/brand"]
src = ["src", "tests"]
